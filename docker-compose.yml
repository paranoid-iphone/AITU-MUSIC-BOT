services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aitu_music
      POSTGRES_USER: aitu
      POSTGRES_PASSWORD: aitu
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aitu -d aitu_music"]
      interval: 5s
      timeout: 5s
      retries: 10

  backup:
    image: postgres:16-alpine
    entrypoint: ["sh", "/ops/pg_backup.sh"]
    environment:
      PGHOST: db
      PGDATABASE: aitu_music
      PGUSER: aitu
      PGPASSWORD: aitu
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./ops:/ops:ro
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: .env
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"

  ngrok:
    image: ngrok/ngrok:3
    command: ["http", "http://backend:8000", "--log", "stdout"]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:?Set NGROK_AUTHTOKEN in .env}
      NGROK_CONFIG: /etc/ngrok.yml
    volumes:
      - ./ngrok.yml:/etc/ngrok.yml:ro
    ports:
      - "127.0.0.1:4040:4040"
    depends_on:
      - backend

  bot:
    build: .
    command: python -m app.bot.main
    env_file: .env
    volumes:
      - .:/app
    depends_on:
      - backend
      - redis
      - ngrok

volumes:
  postgres_data:
